<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261b14"/>
      <stop offset="50%" stop-color="#3b291c"/>
      <stop offset="100%" stop-color="#19110c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb870"/>
      <stop offset="50%" stop-color="#ffe9d1"/>
      <stop offset="100%" stop-color="#ff9033"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff9033" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="960" cy="460" r="500" fill="url(#glow)"/>

  <rect x="120" y="80" width="1680" height="920" rx="24" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.3"/>
  <rect x="140" y="100" width="1640" height="880" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <g transform="translate(960, 400)">
    <circle cx="0" cy="0" r="70" fill="#2d1f14" stroke="url(#gold)" stroke-width="2.5"/>
    <!-- Trophy/Sport icon -->
    <path d="M-20,-20 L20,-20 L15,5 C12,18 0,22 0,22 C0,22 -12,18 -15,5 Z" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <path d="M-20,-12 C-28,-12 -28,-2 -20,-2" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M20,-12 C28,-12 28,-2 20,-2" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <line x1="0" y1="22" x2="0" y2="32" stroke="url(#gold)" stroke-width="4"/>
    <line x1="-15" y1="32" x2="15" y2="32" stroke="url(#gold)" stroke-width="4"/>
  </g>

  <text x="960" y="560" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="url(#gold)" text-anchor="middle">
    Bildeplassholder #5
  </text>
  <text x="960" y="620" font-family="'Inter', 'Segoe UI', sans-serif" font-size="24" fill="#f5dfcf" text-anchor="middle" letter-spacing="2">
    Fritidsaktiviteter, idrett og gode stunder
  </text>
  
  <rect x="760" y="660" width="400" height="42" rx="21" fill="rgba(255,144,51,0.15)" stroke="rgba(255,144,51,0.4)" stroke-width="1"/>
  <text x="960" y="687" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16" fill="#ffe9d1" text-anchor="middle">
    Bytt ut med ditt eget bilde i media/bilder/
  </text>
</svg>
